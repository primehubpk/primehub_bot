name: Phase 1 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-1-chat-shell]

jobs:
  web-checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/primehub_bot
      ADMIN_PASSWORD: ci-only-password
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
